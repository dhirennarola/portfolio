name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Ensures the repo's Pages source is "GitHub Actions" (not the legacy
      # Jekyll branch build, which chokes on .astro files). configure-pages
      # only *creates* the Pages site; the PUT below also flips an existing
      # legacy-source configuration so the failing Jekyll runs stop.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Switch Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sf -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}' \
          || echo "::warning::Could not switch Pages build type via API — set Settings → Pages → Source = GitHub Actions manually"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Tell IndexNow the site changed. One call reaches Bing, Yandex, Seznam
      # and Naver — and DuckDuckGo and Yahoo both source their results from
      # Bing, so this is the fastest route into all four. Google does not
      # participate in IndexNow; it picks the sitemap up via Search Console.
      # Never fails the deploy: indexing is best-effort, shipping is not.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          KEY: 378058de20b41390bb8917d379894ee8
          HOST: dhirennarola.com
        run: |
          set -o pipefail
          # Give the CDN a moment to serve the freshly deployed sitemap.
          sleep 20
          urls=$(curl -sS --max-time 30 "https://$HOST/sitemap-0.xml" \
            | grep -o '<loc>[^<]*</loc>' \
            | sed -e 's|<loc>||' -e 's|</loc>||' \
            | jq -R . | jq -s .)
          count=$(echo "$urls" | jq 'length')
          if [ "$count" = "0" ]; then
            echo "::warning::No URLs parsed from sitemap — skipping IndexNow ping"
            exit 0
          fi
          echo "Submitting $count URLs to IndexNow"
          body=$(jq -n \
            --arg host "$HOST" \
            --arg key "$KEY" \
            --arg keyLocation "https://$HOST/$KEY.txt" \
            --argjson urlList "$urls" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')
          code=$(curl -sS -o /tmp/indexnow.out -w '%{http_code}' --max-time 30 \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$body")
          echo "IndexNow responded $code"
          cat /tmp/indexnow.out || true
          # 200 = accepted, 202 = accepted, key validation pending.
          case "$code" in
            200|202) echo "IndexNow accepted the submission" ;;
            *) echo "::warning::IndexNow returned $code" ;;
          esac
